# Render Blueprint for the AgriDrone API.
# Secrets are sync: false, so Render asks for them in the dashboard and they
# never live in git. Migrations are run manually (npm run db:migrate), never
# automatically on deploy (docs/AGENTS.md §5).
services:
  - type: web
    name: agridrone-api
    runtime: node
    plan: free
    # Same AWS region as the Neon database (us-east-2).
    region: ohio
    rootDir: server
    # --include=dev: TypeScript is a dev dependency and NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
